# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard: New → Blueprint → connect Cyberbully-rpg/CliPRx → Deploy Blueprint
services:
  - type: web
    name: cliprx-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ANOMALY_THRESHOLD
        value: "0.65"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
